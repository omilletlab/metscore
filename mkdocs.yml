site_name: MetSCORE
site_description: Python implementation of MetSCORE

theme:
  name: mkdocs
  navigation_depth: 3

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3

nav:
  - Home: index.md
  - API Reference: api.md
  - Design decisions: design-decisions.md
