[project]
name = "metscore"
version = "0.1.0"
description = "Python implementation of MetSCORE, a serum NMR metabolomics-based metric for metabolic syndrome."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1.5",
]

[project.scripts]
metscore = "metscore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.6",
]
